# Edge-AIGuard Core2 firmware - Phase 1 v1
# Display + touch event + Pi -> Core2 status push (no audio yet, see Phase 2)

esphome:
  name: edge-aiguard-core2
  friendly_name: Edge-AIGuard Core2
  platformio_options:
    lib_deps:
      - lewisxhe/XPowersLib@^0.2.4
  on_boot:
    # priority < 600 so this runs AFTER axp2101 setup (which is at DATA=600)
    priority: 500
    then:
      - lambda: |-
          id(status_text) = "Booting...";
      - delay: 200ms
      # lboue's M5CORE2 init leaves ALDO3 disabled ("This is the speaker"
      # in the source). NS4168 audio amp on Core2 V1.1 needs ALDO3 powered
      # for any sound to come out. Set voltage 3.3V then flip enable bit.
      - lambda: |-
          // Set ALDO3 voltage to 3.3V (register 0x95, value 0x1C = 28 = 500+28*100mV)
          id(axp_id)->write_byte(0x95, 0x1C);
          // Enable ALDO3 (register 0x90 bit 2)
          uint8_t reg = 0;
          if (id(axp_id)->read_byte(0x90, &reg)) {
            reg |= (1 << 2);
            id(axp_id)->write_byte(0x90, reg);
            ESP_LOGI("init", "ALDO3 enabled, 0x90 = 0x%02X", reg);
          } else {
            ESP_LOGE("init", "Failed to read AXP2101 reg 0x90");
          }

esp32:
  board: m5stack-core2
  framework:
    type: arduino  # required by axp192 component

# AXP192 PMIC component (powers LCD backlight + audio rails on Core2).
# Lives outside ESPHome core since 2024.x — community fork from devices.esphome.io.
external_components:
  # Core2 V1.1 (post-2022) has AXP2101 PMIC, NOT AXP192. Even though both
  # respond at I2C 0x34, AXP192 register writes do nothing on AXP2101 →
  # backlight stays off and battery reads 0V. Confirmed via I2C scan
  # showing 0x34/0x40/0x51/0x68 (V1.1 layout) and missing 0x38 touch IC.
  - source: github://lboue/esphome-axp2101
    components: [axp2101]

logger:
  level: DEBUG
  # explicit baud — allows us to read serial via cat /dev/ttyACM0
  baud_rate: 115200

api:
  encryption:
    key: !secret api_password
  actions:
    # Pi pushes radar/state updates here every ~1s
    - action: update_status
      variables:
        new_status: string
        new_hr: float
        new_br: float
      then:
        - lambda: |-
            id(status_text) = new_status;
            id(hr_value) = new_hr;
            id(br_value) = new_br;

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  ap:
    # Fallback AP if WiFi fails; connect to this to reconfig
    ssid: "EdgeAIGuard-Setup"
    password: "12345678"

# I2C bus shared by AXP192 (0x34) and FT6336 touch IC (0x38)
i2c:
  - id: bus_a
    sda: GPIO21
    scl: GPIO22
    scan: true
    frequency: 400kHz

# AXP2101 power management (per official M5Core2 V1.1 docs).
# Initialising it enables the LDOs feeding LCD backlight + touch IC.
sensor:
  - platform: axp2101
    model: M5CORE2
    address: 0x34
    i2c_id: bus_a
    id: axp_id
    update_interval: 30s
    brightness: 75%
    battery_level:
      name: "Core2 Battery Level"
    battery_voltage:
      name: "Core2 Battery Voltage"
    battery_charging:
      name: "Core2 Battery Charging"

# SPI for ILI9342C display
spi:
  - id: spi_lcd
    clk_pin: GPIO18
    mosi_pin: GPIO23

display:
  - platform: ili9xxx
    model: M5STACK
    spi_id: spi_lcd
    cs_pin: GPIO5
    dc_pin: GPIO15
    update_interval: 500ms
    invert_colors: true
    lambda: |-
      it.fill(Color::BLACK);
      // Title bar
      it.printf(160, 12, id(font_title), Color(0xFF, 0xFF, 0xFF),
                TextAlign::TOP_CENTER, "Edge-AIGuard");
      it.line(10, 50, 310, 50, Color(0x44, 0x44, 0x44));

      // Status (color depends on text)
      auto status_color = Color(0x00, 0xFF, 0x00);
      if (id(status_text) == "Listening...") status_color = Color(0xFF, 0xFF, 0x00);
      if (id(status_text) == "Speaking...") status_color = Color(0x00, 0xAA, 0xFF);
      if (id(status_text) == "Thinking...") status_color = Color(0xFF, 0xAA, 0x00);
      it.printf(160, 70, id(font_main), status_color,
                TextAlign::TOP_CENTER, "%s", id(status_text).c_str());

      // HR/BR
      it.printf(20, 130, id(font_main), Color(0xFF, 0x55, 0x55),
                TextAlign::TOP_LEFT, "HR: %.0f bpm", id(hr_value));
      it.printf(20, 165, id(font_main), Color(0x55, 0xAA, 0xFF),
                TextAlign::TOP_LEFT, "BR: %.0f /min", id(br_value));

      // Footer hint
      it.printf(160, 218, id(font_small), Color(0x77, 0x77, 0x77),
                TextAlign::TOP_CENTER, "Tap screen to talk (Phase 2)");

font:
  - file: "gfonts://Roboto"
    id: font_title
    size: 26
  - file: "gfonts://Roboto"
    id: font_main
    size: 22
  - file: "gfonts://Roboto"
    id: font_small
    size: 14

globals:
  - id: status_text
    type: std::string
    restore_value: no
    initial_value: '"Ready"'
  - id: hr_value
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: br_value
    type: float
    restore_value: no
    initial_value: '0.0'

# FT6336 capacitive touch (Core2 screen overlay)
touchscreen:
  - platform: ft63x6
    interrupt_pin: GPIO39
    id: m5_touch

# Phase 2 (incremental rebuild after AXP2101 baseline restored):
# Step 2 — add I2S microphone only. Speaker + voice_assistant follow.

i2s_audio:
  i2s_lrclk_pin: GPIO0
  i2s_bclk_pin: GPIO12

microphone:
  - platform: i2s_audio
    id: m5_mic
    i2s_din_pin: GPIO34
    adc_type: external
    pdm: true
    sample_rate: 16000
    bits_per_sample: 16bit

speaker:
  - platform: i2s_audio
    id: m5_speaker
    dac_type: external   # NS4168 amp on Core2 V1.1, powered via ALDO3
    i2s_dout_pin: GPIO2
    sample_rate: 22050
    bits_per_sample: 16bit

# voice_assistant streams audio in/out via API to Pi-side Core2Transport.
voice_assistant:
  microphone: m5_mic
  speaker: m5_speaker
  noise_suppression_level: 2
  use_wake_word: false
  on_listening:
    - lambda: |-
        id(status_text) = "Listening...";
  on_tts_start:
    - lambda: |-
        id(status_text) = "Speaking...";
  on_end:
    - lambda: |-
        id(status_text) = "Ready";
  on_error:
    - lambda: |-
        id(status_text) = "Error";
        ESP_LOGE("va", "%s: %s", code.c_str(), message.c_str());

binary_sensor:
  - platform: touchscreen
    name: "Touch Trigger"
    touchscreen_id: m5_touch
    x_min: 0
    x_max: 320
    y_min: 0
    y_max: 240
    on_press:
      then:
        - voice_assistant.start
