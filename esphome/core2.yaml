# Edge-AIGuard Core2 firmware - Phase 1 v1
# Display + touch event + Pi -> Core2 status push (no audio yet, see Phase 2)

esphome:
  name: edge-aiguard-core2
  friendly_name: Edge-AIGuard Core2
  platformio_options:
    lib_deps:
      - lewisxhe/XPowersLib@^0.2.4
  on_boot:
    priority: 600
    then:
      - lambda: |-
          id(status_text) = "Booting...";

esp32:
  board: m5stack-core2
  framework:
    type: arduino  # required by axp192 component

# AXP192 PMIC component (powers LCD backlight + audio rails on Core2).
# Lives outside ESPHome core since 2024.x — community fork from devices.esphome.io.
external_components:
  # Core2 V1.1 (post-2022) has AXP2101 PMIC, NOT AXP192. Even though both
  # respond at I2C 0x34, AXP192 register writes do nothing on AXP2101 →
  # backlight stays off and battery reads 0V. Confirmed via I2C scan
  # showing 0x34/0x40/0x51/0x68 (V1.1 layout) and missing 0x38 touch IC.
  - source: github://lboue/esphome-axp2101
    components: [axp2101]

logger:
  level: DEBUG
  # explicit baud — allows us to read serial via cat /dev/ttyACM0
  baud_rate: 115200

api:
  encryption:
    key: !secret api_password
  actions:
    # Pi pushes radar/state updates here every ~1s
    - action: update_status
      variables:
        new_status: string
        new_hr: float
        new_br: float
      then:
        - lambda: |-
            id(status_text) = new_status;
            id(hr_value) = new_hr;
            id(br_value) = new_br;

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  ap:
    # Fallback AP if WiFi fails; connect to this to reconfig
    ssid: "EdgeAIGuard-Setup"
    password: "12345678"

# I2C bus shared by AXP192 (0x34) and FT6336 touch IC (0x38)
i2c:
  - id: bus_a
    sda: GPIO21
    scl: GPIO22
    scan: true
    frequency: 400kHz

# AXP2101 power management (per official M5Core2 V1.1 docs).
# Initialising it enables the LDOs feeding LCD backlight + touch IC.
sensor:
  - platform: axp2101
    model: M5CORE2
    address: 0x34
    i2c_id: bus_a
    id: axp_id
    update_interval: 30s
    brightness: 75%
    battery_level:
      name: "Core2 Battery Level"
    battery_voltage:
      name: "Core2 Battery Voltage"
    battery_charging:
      name: "Core2 Battery Charging"

# SPI for ILI9342C display
spi:
  - id: spi_lcd
    clk_pin: GPIO18
    mosi_pin: GPIO23

display:
  - platform: ili9xxx
    model: M5STACK
    spi_id: spi_lcd
    cs_pin: GPIO5
    dc_pin: GPIO15
    update_interval: 500ms
    invert_colors: true
    lambda: |-
      it.fill(Color::BLACK);
      // Title bar
      it.printf(160, 12, id(font_title), Color(0xFF, 0xFF, 0xFF),
                TextAlign::TOP_CENTER, "Edge-AIGuard");
      it.line(10, 50, 310, 50, Color(0x44, 0x44, 0x44));

      // Status (color depends on text)
      auto status_color = Color(0x00, 0xFF, 0x00);
      if (id(status_text) == "Listening...") status_color = Color(0xFF, 0xFF, 0x00);
      if (id(status_text) == "Speaking...") status_color = Color(0x00, 0xAA, 0xFF);
      if (id(status_text) == "Thinking...") status_color = Color(0xFF, 0xAA, 0x00);
      it.printf(160, 70, id(font_main), status_color,
                TextAlign::TOP_CENTER, "%s", id(status_text).c_str());

      // HR/BR
      it.printf(20, 130, id(font_main), Color(0xFF, 0x55, 0x55),
                TextAlign::TOP_LEFT, "HR: %.0f bpm", id(hr_value));
      it.printf(20, 165, id(font_main), Color(0x55, 0xAA, 0xFF),
                TextAlign::TOP_LEFT, "BR: %.0f /min", id(br_value));

      // Footer hint
      it.printf(160, 218, id(font_small), Color(0x77, 0x77, 0x77),
                TextAlign::TOP_CENTER, "Tap screen to talk (Phase 2)");

font:
  - file: "gfonts://Roboto"
    id: font_title
    size: 26
  - file: "gfonts://Roboto"
    id: font_main
    size: 22
  - file: "gfonts://Roboto"
    id: font_small
    size: 14

globals:
  - id: status_text
    type: std::string
    restore_value: no
    initial_value: '"Ready"'
  - id: hr_value
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: br_value
    type: float
    restore_value: no
    initial_value: '0.0'

# FT6336 capacitive touch (Core2 screen overlay)
touchscreen:
  - platform: ft63x6
    interrupt_pin: GPIO39
    id: m5_touch

# PHASE 2 ROLLED BACK — i2s_audio + voice_assistant suspected of bricking
# the LCD path. Re-enable incrementally after we confirm Phase 1 still works.
# Backup of the audio-enabled version: core2_v2_audio.yaml.

# Phase 1 fallback: touch logs only, no voice_assistant binding.
binary_sensor:
  - platform: touchscreen
    name: "Touch Trigger"
    touchscreen_id: m5_touch
    x_min: 0
    x_max: 320
    y_min: 0
    y_max: 240
    on_press:
      then:
        - logger.log: "Touch detected (Phase 1 fallback)"
