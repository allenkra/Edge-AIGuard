# Edge-AIGuard Core2 firmware - Phase 1 v1
# Display + touch event + Pi -> Core2 status push (no audio yet, see Phase 2)

esphome:
  name: edge-aiguard-core2
  friendly_name: Edge-AIGuard Core2
  on_boot:
    priority: 600
    then:
      - lambda: |-
          id(status_text) = "Booting...";

esp32:
  board: m5stack-core2
  framework:
    type: arduino  # required by axp192 component

# AXP192 PMIC component (powers LCD backlight + audio rails on Core2).
# Lives outside ESPHome core since 2024.x — community fork from devices.esphome.io.
external_components:
  - source: github://martydingo/esphome-axp192
    components: [axp192]

logger:
  level: INFO

api:
  encryption:
    key: !secret api_password
  actions:
    # Pi pushes radar/state updates here every ~1s
    - action: update_status
      variables:
        new_status: string
        new_hr: float
        new_br: float
      then:
        - lambda: |-
            id(status_text) = new_status;
            id(hr_value) = new_hr;
            id(br_value) = new_br;

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  ap:
    # Fallback AP if WiFi fails; connect to this to reconfig
    ssid: "EdgeAIGuard-Setup"
    password: "12345678"

# I2C bus shared by AXP192 (0x34) and FT6336 touch IC (0x38)
i2c:
  - id: bus_a
    sda: GPIO21
    scl: GPIO22
    scan: true
    frequency: 400kHz

# AXP192 power management as sensor platform (per official M5Core2 docs).
# Initialising it auto-enables LDO2 (LCD backlight) + DC-DC3 (LCD logic).
sensor:
  - platform: axp192
    model: M5CORE2
    address: 0x34
    i2c_id: bus_a
    id: axp192_id
    update_interval: 30s
    battery_level:
      name: "Core2 Battery Level"

# SPI for ILI9342C display
spi:
  - id: spi_lcd
    clk_pin: GPIO18
    mosi_pin: GPIO23

display:
  - platform: mipi_spi
    model: M5CORE2
    spi_id: spi_lcd
    update_interval: 500ms
    lambda: |-
      it.fill(Color::BLACK);
      // Title bar
      it.printf(160, 12, id(font_title), Color(0xFF, 0xFF, 0xFF),
                TextAlign::TOP_CENTER, "Edge-AIGuard");
      it.line(10, 50, 310, 50, Color(0x44, 0x44, 0x44));

      // Status (color depends on text)
      auto status_color = Color(0x00, 0xFF, 0x00);
      if (id(status_text) == "Listening...") status_color = Color(0xFF, 0xFF, 0x00);
      if (id(status_text) == "Speaking...") status_color = Color(0x00, 0xAA, 0xFF);
      if (id(status_text) == "Thinking...") status_color = Color(0xFF, 0xAA, 0x00);
      it.printf(160, 70, id(font_main), status_color,
                TextAlign::TOP_CENTER, "%s", id(status_text).c_str());

      // HR/BR
      it.printf(20, 130, id(font_main), Color(0xFF, 0x55, 0x55),
                TextAlign::TOP_LEFT, "HR: %.0f bpm", id(hr_value));
      it.printf(20, 165, id(font_main), Color(0x55, 0xAA, 0xFF),
                TextAlign::TOP_LEFT, "BR: %.0f /min", id(br_value));

      // Footer hint
      it.printf(160, 218, id(font_small), Color(0x77, 0x77, 0x77),
                TextAlign::TOP_CENTER, "Tap screen to talk (Phase 2)");

font:
  - file: "gfonts://Roboto"
    id: font_title
    size: 26
  - file: "gfonts://Roboto"
    id: font_main
    size: 22
  - file: "gfonts://Roboto"
    id: font_small
    size: 14

globals:
  - id: status_text
    type: std::string
    restore_value: no
    initial_value: '"Ready"'
  - id: hr_value
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: br_value
    type: float
    restore_value: no
    initial_value: '0.0'

# FT6336 capacitive touch (Core2 screen overlay)
touchscreen:
  - platform: ft63x6
    interrupt_pin: GPIO39
    id: m5_touch

# Phase 2: I2S audio peripherals
# Core2 PDM mic (SPM1423) and NS4168 speaker share the same I2S clock line
# (GPIO0). Single i2s_audio block, ESPHome handles direction multiplexing.
i2s_audio:
  i2s_lrclk_pin: GPIO0
  i2s_bclk_pin: GPIO12

microphone:
  - platform: i2s_audio
    id: m5_mic
    i2s_din_pin: GPIO34
    adc_type: external
    pdm: true
    sample_rate: 16000
    bits_per_sample: 16bit

speaker:
  - platform: i2s_audio
    id: m5_speaker
    dac_type: external   # NS4168 amp on Core2
    i2s_dout_pin: GPIO2
    sample_rate: 22050
    bits_per_sample: 16bit

# voice_assistant: streams audio in/out via the API (over UDP) to whichever
# native API client subscribed via subscribe_voice_assistant() — that's our
# Core2Transport on the Pi side.
voice_assistant:
  microphone: m5_mic
  speaker: m5_speaker
  noise_suppression_level: 2
  use_wake_word: false   # Phase 3 / Future Work
  auto_gain: 31dBFS
  on_listening:
    - lambda: |-
        id(status_text) = "Listening...";
  on_tts_start:
    - lambda: |-
        id(status_text) = "Speaking...";
  on_end:
    - lambda: |-
        id(status_text) = "Ready";
  on_error:
    - lambda: |-
        id(status_text) = "Error";
        ESP_LOGE("va", "%s: %s", code.c_str(), message.c_str());

# Touch anywhere on screen = tap-to-talk: starts a voice_assistant session.
# Endpoint detection (silence) ends the session automatically.
binary_sensor:
  - platform: touchscreen
    name: "Touch Trigger"
    touchscreen_id: m5_touch
    x_min: 0
    x_max: 320
    y_min: 0
    y_max: 240
    on_press:
      then:
        - voice_assistant.start
